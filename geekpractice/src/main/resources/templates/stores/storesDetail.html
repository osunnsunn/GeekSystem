<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/store/store.css}">
	<title>店舗詳細</title>
</head>

<body>

	<header class="header">
		<h1>店舗詳細</h1>
		<div class="box">
			<form th:action="@{/login}" method="post">
				<button type="submit" class="loguot">ログアウト</button>
			</form>
			<a href="/stores/storesList"><button>戻る</button></a>
		</div>
	</header>
	
	<div class="container">
		<div class="store_box">
			<div>
				<p>店舗ID：<span th:text="${stores.id}"></span></p>
			</div>
			<div>
				<p>店舗：<span th:text="${stores.name}"></span></p>
			</div>
			<div>
				<p>住所：<span th:text="${stores.address}"></span></p>
			</div>
		</div>
	</div>

	<div class="store_btn">
		<a th:href="@{/stores/stores/{id}/Edit(id=${stores.id})}">
			<button type="button">編集する</button>
		</a>
	</div>

</body>

</html>
