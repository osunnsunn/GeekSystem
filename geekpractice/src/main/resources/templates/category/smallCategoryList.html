<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<title>小カテゴリ一覧</title>
</head>

<body>

	<header class="header">
		<h1>小カテゴリ一覧</h1>
		<div class="box">
			<form th:action="@{/login}" method="post">
				<button type="submit" class="loguot">ログアウト</button>
			</form>
			<a href="/category/middleCategoryList/'+${id}"><button>戻る</button></a>
		</div>
	</header>

	<div class="container">
		<table border="1">
			<tr>
				<th class="width-1">小カテゴリID</th>
				<th class="width-2">小カテゴリ名</th>
			</tr>
			<tr th:each="smaillCategory : ${smaillCategoryList}">
				<td><span th:text="${id}"></span></td>
				<td><span th;text="${name}"></span></td>
			</tr>
		</table>
	</div>

</body>

</html>
